<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Marque Minimaliste</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #ffffff;
      color: #111;
      text-align: center;
    }

    header {
      padding: 50px 20px;
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .subtitle {
      font-size: 14px;
      color: #666;
      margin-top: -10px;
    }

    .products {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      margin-top: 40px;
      gap: 20px;
    }

    .card {
      border: 1px solid #eee;
      padding: 20px;
      width: 200px;
    }

    .card h3 {
      font-size: 16px;
    }

    .price {
      margin: 10px 0;
      font-weight: bold;
    }

    .btn {
      display: inline-block;
      padding: 10px 15px;
      background: black;
      color: white;
      text-decoration: none;
      font-size: 12px;
    }

    footer {
      margin-top: 60px;
      font-size: 12px;
      color: #888;
      padding: 20px;
    }
  </style>
</head>

<body>

  <header>
    Typhon Project
    <div class="subtitle">Minimalist clothing made for everyone</div>
  </header>

  <section class="products">

    <div class="card">
      <h3>Classic Tee-shirt</h3>
      <div class="price">€25</div>
      <a class="btn" href="#">Buy</a>
    </div>

    <div class="card">
      <h3>Oversized Hoodie</h3>
      <div class="price">€45</div>
      <a class="btn" href="#">Buy</a>
    </div>

    <div class="card">
      <h3>Basic Sweatshirt</h3>
      <div class="price">€40</div>
      <a class="btn" href="#">Buy</a>
    </div>

  </section>

  <footer>
    © 2026 Your Brand — Print on Demand Clothing
  </footer>

</body>
</html>
